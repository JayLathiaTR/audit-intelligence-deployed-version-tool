<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CORS Fetch Tester</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type=text] { flex: 1; min-width: 320px; padding: 8px; }
    select, button { padding: 8px; }
    pre { padding: 12px; border: 1px solid rgba(127,127,127,.35); border-radius: 6px; overflow: auto; }
    .hint { font-size: 13px; opacity: 0.85; }
    .ok { color: #11823b; }
    .bad { color: #b42318; }
  </style>
</head>
<body>
  <h1>CORS Fetch Tester (run from GitHub Pages)</h1>
  <p class="hint">
    Use this page to test whether your API endpoint is callable from a browser origin.
    If you run this from <code>github.com</code> (repo UI), GitHub’s CSP will block many outbound fetches.
    Run it from your Pages site: <code>https://&lt;org-or-user&gt;.github.io/&lt;repo&gt;/</code>.
  </p>

  <div class="row">
    <label>
      Method
      <select id="method">
        <option>GET</option>
        <option>HEAD</option>
        <option>OPTIONS</option>
      </select>
    </label>

    <label style="flex: 1; min-width: 320px;">
      URL
      <input id="url" type="text" spellcheck="false" value="" placeholder="https://example.com/path" />
    </label>

    <button id="go">Fetch</button>
    <button id="sample">Use sample</button>
  </div>

  <pre id="out">Ready.</pre>

  <script>
    const out = document.getElementById('out');
    const urlInput = document.getElementById('url');
    const methodSel = document.getElementById('method');

    const sampleUrl = 'https://qed.api.aitest.thomsonreuters.com/ait/core/swagger/v3/swagger.json';

    function write(text, cls) {
      out.className = cls || '';
      out.textContent = text;
    }

    function formatHeaders(headers) {
      const lines = [];
      for (const [k, v] of headers.entries()) lines.push(`${k}: ${v}`);
      return lines.length ? lines.join('\n') : '(no readable headers)';
    }

    async function run() {
      const url = urlInput.value.trim();
      const method = methodSel.value;
      if (!url) {
        write('Enter a URL first.', 'bad');
        return;
      }

      write(`Fetching...\n\nmethod: ${method}\nurl: ${url}\norigin: ${location.origin}`, '');

      try {
        const resp = await fetch(url, {
          method,
          mode: 'cors',
          // Avoid sending cookies across origins unless you explicitly need them.
          credentials: 'omit',
          cache: 'no-store'
        });

        const headerText = formatHeaders(resp.headers);
        let bodyText = '';
        if (method !== 'HEAD') {
          try {
            const contentType = resp.headers.get('content-type') || '';
            if (contentType.includes('application/json')) {
              const json = await resp.json();
              bodyText = JSON.stringify(json, null, 2);
            } else {
              bodyText = await resp.text();
            }
          } catch (e) {
            bodyText = `(body read failed) ${String(e)}`;
          }
        }

        write(
          `OK (${resp.status} ${resp.statusText})\n\n=== Response headers (what the browser allows you to see) ===\n${headerText}\n\n=== Body (truncated to 64KB) ===\n${String(bodyText).slice(0, 65536)}`,
          resp.ok ? 'ok' : 'bad'
        );
      } catch (e) {
        // In browsers, CORS failures usually surface as a TypeError: Failed to fetch.
        write(
          `FAILED\n\nerror: ${String(e)}\n\nIf DevTools shows “blocked by Content Security Policy”, you are likely running this on github.com.\nIf DevTools shows “blocked by CORS policy”, then the API isn’t sending the required Access-Control-Allow-* headers for this origin.`,
          'bad'
        );
      }
    }

    document.getElementById('go').addEventListener('click', run);
    document.getElementById('sample').addEventListener('click', () => {
      urlInput.value = sampleUrl;
      write(`Sample URL set. Click Fetch.\n\n${sampleUrl}`);
    });
  </script>
</body>
</html>
