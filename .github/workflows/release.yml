name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "AitApplicationDeployedVersions.sln"

      - name: Publish (single-file EXE)
        run: |
          dotnet publish "AitApplicationDeployedVersions.Avalonia/AitApplicationDeployedVersions.Avalonia.csproj" -c Release -r win-x64 --self-contained true -o "artifacts/publish/win-x64" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false

      - name: Rename EXE for release asset
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $src = "artifacts/publish/win-x64/AitApplicationDeployedVersions.exe"
          $dst = "artifacts/publish/win-x64/AitApplicationDeployedVersions-$tag-win-x64.exe"
          Copy-Item -LiteralPath $src -Destination $dst -Force

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/publish/win-x64/AitApplicationDeployedVersions-${{ github.ref_name }}-win-x64.exe
