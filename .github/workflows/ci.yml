name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "AitApplicationDeployedVersions.sln"

      - name: Build
        run: dotnet build "AitApplicationDeployedVersions.sln" -c Release --no-restore

      - name: Publish (single-file EXE)
        run: |
          dotnet publish "AitApplicationDeployedVersions.Avalonia/AitApplicationDeployedVersions.Avalonia.csproj" -c Release -r win-x64 --self-contained true -o "artifacts/publish/win-x64" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false

      - name: Upload artifact (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: AitApplicationDeployedVersions-win-x64
          path: artifacts/publish/win-x64/AitApplicationDeployedVersions.exe
          if-no-files-found: error
